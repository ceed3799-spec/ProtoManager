<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fond arrondi squircle façon iOS -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Grille technique discrète de prototypage / CNC -->
  <path d="M64 160h384M64 256h384M64 352h384M160 64v384M256 64v384M352 64v384" 
        stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Symbole central : 'P' technique stylisé combiné avec un cadran / aiguille de temps -->
  <g filter="url(#glow)">
    <!-- Base du 'P' -->
    <path d="M168 128h112a80 80 0 0 1 80 80v0a80 80 0 0 1-80 80h-64v96h-48V128z" 
          fill="url(#pGrad)" />
    <!-- Trou interne du 'P' -->
    <path d="M216 176h64a32 32 0 0 1 32 32v0a32 32 0 0 1-32 32h-64v-64z" 
          fill="#064e3b" />
    <!-- Repère chrono / CNC au centre -->
    <circle cx="248" cy="208" r="14" fill="#a7f3d0" />
    <path d="M248 208l16 -16" stroke="#064e3b" stroke-width="4" stroke-linecap="round" />
    <!-- Repère d'atelier / compas en bas à droite -->
    <circle cx="344" cy="344" r="28" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="6" />
    <path d="M344 328v32M328 344h32" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>